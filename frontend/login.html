<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ورود — Talentick</title>
  <meta name="description" content="ورود به فضای کاری Talentick — پلتفرم آنبوردینگ و یادگیری سازمانی." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body class="ds auth-body">

  <div class="auth-page">
    <div class="auth-hero">
      <div class="auth-logo" id="authLogo"></div>
      <div class="auth-hero-scene" id="authHeroScene"></div>
    </div>

    <div class="auth-sheet">
      <div class="auth-sheet-inner">
        <div class="auth-heading">
          <h1>خوش آمدید</h1>
          <p>برای ادامه، ایمیل/شماره موبایل و رمز عبور خود را وارد کنید</p>
        </div>

        <div class="alert-error" id="alertError" role="alert">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="alertText">خطایی رخ داده است</span>
        </div>

        <form id="loginForm" novalidate>
          <div class="ds-field">
            <label class="ds-label" for="email">ایمیل یا شماره موبایل</label>
            <div class="ds-input-wrap">
              <input id="email" type="text" class="ds-input" placeholder="example@company.ir" autocomplete="username" required dir="ltr" style="text-align:left;" />
              <span class="ds-input-icon">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 6.5l9 6.5 9-6.5"/></svg>
              </span>
            </div>
          </div>

          <div class="ds-field" style="margin-top:16px;">
            <label class="ds-label" for="password">رمز عبور</label>
            <div class="ds-input-wrap">
              <input id="password" type="password" class="ds-input" placeholder="••••••••" autocomplete="current-password" required dir="ltr" style="text-align:left;padding-right:18px;padding-left:48px;" />
              <button type="button" class="ds-input-action" id="togglePassword" tabindex="-1" aria-label="نمایش رمز عبور" style="left:16px;right:auto;">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              </button>
            </div>
          </div>

          <div class="auth-row">
            <label class="ds-check">
              <input type="checkbox" id="rememberMe" />
              مرا به خاطر بسپار
            </label>
            <a href="/forget-password.html" class="auth-link">فراموشی رمز عبور؟</a>
          </div>

          <button type="submit" class="ds-btn ds-btn-primary ds-btn-block" id="btnLogin" style="margin-top:26px;">
            <div class="ds-spinner"></div>
            <span class="ds-btn-text">ورود به سامانه</span>
          </button>
        </form>

        <div class="auth-footer">
          حساب کاربری ندارید؟
          <a href="#" id="signupHint">با مدیر سازمان خود تماس بگیرید</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/illustrations.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
