<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>فراموشی رمز عبور — Talentick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body class="ds auth-body">

  <div class="auth-page">
    <div class="auth-hero fp-hero">
      <a href="/login.html" class="auth-back" style="background:var(--gray-100);color:var(--gray-600);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <div class="auth-hero-scene" id="fpScene" style="opacity:1;"></div>
    </div>

    <div class="auth-sheet" style="margin-top:0;box-shadow:none;">
      <div class="auth-sheet-inner">
        <div class="auth-heading">
          <h1>فراموشی رمز عبور</h1>
          <p>شماره موبایل خود را وارد کنید تا کد تایید برای شما ارسال شود.</p>
        </div>

        <div class="alert-error" id="fpError" role="alert">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="fpErrorText">خطایی رخ داده است</span>
        </div>

        <div class="alert-error" id="fpSuccess" role="status" style="background:#F0FDF4;border-color:#BBF7D0;color:#16A34A;">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          <span>کد تایید به شماره‌ی شما پیامک شد.</span>
        </div>

        <form id="fpForm" novalidate>
          <div class="ds-field">
            <div class="ds-input-wrap">
              <input id="fpPhone" type="tel" class="ds-input" placeholder="شماره موبایل" autocomplete="tel" required dir="ltr" style="text-align:left;" />
              <span class="ds-input-icon">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path stroke-linecap="round" d="M11 18h2"/></svg>
              </span>
            </div>
          </div>

          <button type="submit" class="ds-btn ds-btn-primary ds-btn-block" id="btnSendCode" style="margin-top:22px;">
            <div class="ds-spinner"></div>
            <span class="ds-btn-text">ارسال کد تایید</span>
          </button>
        </form>

        <div class="auth-footer">
          <a href="/login.html">بازگشت به صفحه ورود</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/illustrations.js"></script>
  <script src="assets/js/forget-password.js"></script>
</body>
</html>
