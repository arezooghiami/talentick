#      ACME challenge بالا در دسترس باشد.
#   2. با certbot (standalone یا webroot mode روی همان volume
#      /var/www/certbot) گواهی را برای دامنه‌ی واقعی صادر کنید، مثلاً:
#        certbot certonly --webroot -w /var/www/certbot -d your-domain.com
